name: package-release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Choose between rebuilding a published release plan or building from desktop main for artifact-only testing.'
        required: false
        default: published-release
        type: choice
        options:
          - published-release
          - main
      release_tag:
        description: 'Published win_store_packer release tag to rebuild from its attached release-plan.json asset. Used only when build_mode=published-release.'
        required: false
        type: string
      dry_run:
        description: 'Build and stage release metadata without publishing to GitHub Releases. Used only when build_mode=published-release.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

env:
  RESOLVED_BUILD_PLAN_ARTIFACT_NAME: resolved-build-plan
  DESKTOP_AZURE_SAS_URL: ${{ secrets.desktop_azure_sas_url || secrets.WIN_STORE_PACKER_DESKTOP_AZURE_SAS_URL || secrets.DESKTOP_AZURE_SAS_URL }}
  SERVER_AZURE_SAS_URL: ${{ secrets.server_azure_sas_url || secrets.WIN_STORE_PACKER_SERVER_AZURE_SAS_URL || secrets.SERVER_AZURE_SAS_URL || secrets.SERVICE_AZURE_SAS_URL }}
  DLC_AZURE_SAS_URL: ${{ secrets.dlc_azure_sas_url || secrets.WIN_STORE_PACKER_DLC_AZURE_SAS_URL || secrets.DLC_AZURE_SAS_URL || secrets.PORTABLE_VERSION_DLC_AZURE_SAS_URL }}
  HAGISCRIPT_INSTALL_SPEC: '@hagicode/hagiscript@latest'

jobs:
  resolve_plan:
    name: Resolve release plan
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      build_mode: ${{ steps.target.outputs.build_mode }}
      dry_run: ${{ steps.target.outputs.dry_run }}
      publication_mode: ${{ steps.target.outputs.publication_mode }}
      handoff_source: ${{ steps.target.outputs.handoff_source }}
      platform_matrix: ${{ steps.validate.outputs.platform_matrix }}
    steps:
      - name: Checkout win_store_packer
        uses: actions/checkout@v5

      - name: Resolve packer Release Drafter tag for main test builds
        id: packer_release_drafter
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'main'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          dry-run: true
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install win_store_packer dependencies
        shell: bash
        run: npm ci

      - name: Resolve target release
        id: target
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'release' ]; then
            build_mode='published-release'
            release_tag='${{ github.event.release.tag_name }}'
            dry_run='false'
            publication_mode='github-release'
            handoff_source='draft-release-asset'
          else
            build_mode='${{ inputs.build_mode }}'

            if [ "$build_mode" = 'main' ]; then
              release_tag='${{ steps.packer_release_drafter.outputs.tag_name }}'
              dry_run='false'
              publication_mode='workflow-artifact'
              handoff_source='workflow-artifact'
            else
              release_tag='${{ inputs.release_tag }}'
              dry_run='${{ inputs.dry_run }}'
              publication_mode='github-release'
              handoff_source='draft-release-asset'
            fi
          fi

          if [ -z "$release_tag" ]; then
            if [ "$build_mode" = 'main' ]; then
              printf '::error::Unable to resolve a Release Drafter tag for the main test build.\n'
            else
              printf '::error::A published release tag is required.\n'
            fi
            exit 1
          fi

          {
            echo "build_mode=$build_mode"
            echo "release_tag=$release_tag"
            echo "dry_run=$dry_run"
            echo "publication_mode=$publication_mode"
            echo "handoff_source=$handoff_source"
          } >> "$GITHUB_OUTPUT"

      - name: Download attached release plan
        if: steps.target.outputs.build_mode != 'main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-plan"
          node scripts/download-release-plan.mjs \
            --release-tag "${{ steps.target.outputs.release_tag }}" \
            --output "$RUNNER_TEMP/build-plan/release-plan.json"

      - name: Resolve main test build plan
        if: steps.target.outputs.build_mode == 'main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIN_STORE_PACKER_DESKTOP_AZURE_SAS_URL: ${{ env.DESKTOP_AZURE_SAS_URL }}
          WIN_STORE_PACKER_SERVER_AZURE_SAS_URL: ${{ env.SERVER_AZURE_SAS_URL }}
          WIN_STORE_PACKER_DLC_AZURE_SAS_URL: ${{ env.DLC_AZURE_SAS_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-plan"
          node scripts/resolve-dispatch-build-plan.mjs \
            --event-name workflow_dispatch \
            --event-path "$GITHUB_EVENT_PATH" \
            --packer-release-tag "${{ steps.target.outputs.release_tag }}" \
            --producer-workflow package-release \
            --publication-mode workflow-artifact \
            --handoff-source workflow-artifact \
            --output "$RUNNER_TEMP/build-plan/release-plan.json"

      - name: Validate release plan
        id: validate
        shell: bash
        run: |
          node scripts/resolve-release-plan.mjs \
            --plan "$RUNNER_TEMP/build-plan/release-plan.json" \
            --expected-release-tag "${{ steps.target.outputs.release_tag }}" \
            --expected-publication-mode "${{ steps.target.outputs.publication_mode }}" \
            --expected-handoff-source "${{ steps.target.outputs.handoff_source }}"

      - name: Upload resolved build plan
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RESOLVED_BUILD_PLAN_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/build-plan/release-plan.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target.platform }} ${{ matrix.variant }}
    needs: resolve_plan
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve_plan.outputs.platform_matrix).include }}
        variant:
          - unsigned
          - signed
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout win_store_packer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout hagicode-desktop input
        uses: actions/checkout@v5
        with:
          repository: HagiCode-org/desktop
          ref: main
          path: inputs/hagicode-desktop
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install win_store_packer dependencies
        shell: bash
        run: npm ci

      - name: Install global hagiscript
        shell: bash
        run: |
          npm install -g "$HAGISCRIPT_INSTALL_SPEC"

          npm_prefix="$(npm config get prefix)"
          if [ "$RUNNER_OS" = 'Windows' ]; then
            echo "$npm_prefix" >> "$GITHUB_PATH"
            export PATH="$npm_prefix:$PATH"
          else
            echo "$npm_prefix/bin" >> "$GITHUB_PATH"
            export PATH="$npm_prefix/bin:$PATH"
          fi

          hagiscript --version

      - name: Download resolved build plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.RESOLVED_BUILD_PLAN_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/build-plan

      - name: Determine signing mode
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = 'signed' ]; then
            echo "STORE_WORKSPACE=$RUNNER_TEMP/store-release-${{ matrix.target.platform }}-signed" >> "$GITHUB_ENV"
            echo "STORE_REQUIRE_SIGNED=true" >> "$GITHUB_ENV"
            echo 'STORE_SIGNING_MODE=external' >> "$GITHUB_ENV"
          else
            echo "STORE_WORKSPACE=$RUNNER_TEMP/store-release-${{ matrix.target.platform }}-unsigned" >> "$GITHUB_ENV"
            echo 'STORE_SIGNING_MODE=disabled' >> "$GITHUB_ENV"
            echo 'STORE_REQUIRE_SIGNED=false' >> "$GITHUB_ENV"
          fi

      - name: Configure Electron cache directories
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/.cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/.cache/electron-builder" >> "$GITHUB_ENV"

      - name: Validate external signing configuration
        if: success() && matrix.variant == 'signed' && needs.resolve_plan.outputs.dry_run != 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CODESIGN_ENDPOINT: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT_NAME: ${{ secrets.AZURE_CODESIGN_ACCOUNT_NAME }}
          AZURE_CODESIGN_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CODESIGN_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_PACKAGE_PUBLISHER: ${{ secrets.WINDOWS_PACKAGE_PUBLISHER }}
        run: |
          missing=()
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CODESIGN_ENDPOINT AZURE_CODESIGN_ACCOUNT_NAME AZURE_CODESIGN_CERTIFICATE_PROFILE_NAME WINDOWS_PACKAGE_PUBLISHER; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing external signing configuration: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Prepare tagged desktop workspace
        shell: bash
        run: |
          node scripts/prepare-packaging-workspace.mjs \
            --plan "$RUNNER_TEMP/build-plan/release-plan.json" \
            --platform "${{ matrix.target.platform }}" \
            --workspace "$STORE_WORKSPACE" \
            --desktop-source "$GITHUB_WORKSPACE/inputs/hagicode-desktop"

      - name: Cache desktop build downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/.cache/electron
            ${{ runner.temp }}/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/.cache/electron-builder
            ${{ runner.temp }}/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/build/embedded-runtime/downloads
            ${{ runner.temp }}/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/build/embedded-node-runtime/downloads
            ${{ runner.temp }}/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/.generated/code-server-runtime/downloads
            ${{ runner.temp }}/store-release-${{ matrix.target.platform }}-${{ matrix.variant }}/extracted/desktop/.generated/omniroute-runtime/downloads
          key: ${{ runner.os }}-desktop-build-downloads-${{ hashFiles('inputs/hagicode-desktop/package-lock.json', 'inputs/hagicode-desktop/resources/manifest.yml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-build-downloads-

      - name: Download and validate server payload
        shell: bash
        env:
          WIN_STORE_PACKER_SERVER_AZURE_SAS_URL: ${{ env.SERVER_AZURE_SAS_URL }}
          WIN_STORE_PACKER_DLC_AZURE_SAS_URL: ${{ env.DLC_AZURE_SAS_URL }}
        run: |
          node scripts/stage-server-payload.mjs \
            --plan "$RUNNER_TEMP/build-plan/release-plan.json" \
            --platform "${{ matrix.target.platform }}" \
            --workspace "$STORE_WORKSPACE"

      - name: Build Store package
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.TENANT_ID || secrets.AZURE_AD_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET || secrets.CLIENT_SECRET || secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_CODESIGN_APPX_PUBLISHER: ${{ secrets.AZURE_CODESIGN_APPX_PUBLISHER || secrets.WINDOWS_PACKAGE_PUBLISHER }}
          WINDOWS_PACKAGE_PUBLISHER: ${{ secrets.WINDOWS_PACKAGE_PUBLISHER || secrets.AZURE_CODESIGN_APPX_PUBLISHER }}
          AZURE_CODESIGN_ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT || secrets.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT_NAME: ${{ vars.AZURE_CODESIGN_ACCOUNT_NAME || secrets.AZURE_CODESIGN_ACCOUNT_NAME }}
          AZURE_CODESIGN_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CODESIGN_CERTIFICATE_PROFILE_NAME || secrets.AZURE_CODESIGN_CERTIFICATE_PROFILE_NAME }}
        run: |
          node scripts/build-msix.mjs \
            --plan "$RUNNER_TEMP/build-plan/release-plan.json" \
            --platform "${{ matrix.target.platform }}" \
            --workspace "$STORE_WORKSPACE" \
            --artifact-variant "${{ matrix.variant }}" \
            --signing-mode "$STORE_SIGNING_MODE"

      - name: Azure login for external signing
        if: success() && matrix.variant == 'signed' && needs.resolve_plan.outputs.dry_run != 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Collect Windows package catalog
        if: success() && matrix.variant == 'signed' && needs.resolve_plan.outputs.dry_run != 'true'
        id: msix_catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:STORE_WORKSPACE 'release-assets'
          $catalogPath = Join-Path $env:STORE_WORKSPACE 'windows-signable-artifacts.txt'
          $workspaceRoot = [System.IO.Path]::GetFullPath($env:STORE_WORKSPACE)
          $files = @(Get-ChildItem -LiteralPath $releaseDir -File | Where-Object { $_.Extension -eq '.msix' } | Sort-Object FullName -Unique)

          if ($files.Count -eq 0) {
            throw 'No packaged Store artifacts were found for signing.'
          }

          $files | ForEach-Object { [System.IO.Path]::GetRelativePath($workspaceRoot, $_.FullName) } | Set-Content -Path $catalogPath

          Add-Content -Path $env:GITHUB_OUTPUT -Value "catalog_path=$catalogPath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'package_files<<EOF'
          $files | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_.FullName }
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'EOF'

      - name: Sign MSIX artifacts with Artifact Signing
        if: success() && matrix.variant == 'signed' && needs.resolve_plan.outputs.dry_run != 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODESIGN_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGN_CERTIFICATE_PROFILE_NAME }}
          files-catalog: ${{ steps.msix_catalog.outputs.catalog_path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: true

      - name: Finalize Store package metadata
        if: success() && (matrix.variant != 'signed' || needs.resolve_plan.outputs.dry_run != 'true')
        shell: bash
        run: |
          args=(
            --workspace "$STORE_WORKSPACE"
            --platform "${{ matrix.target.platform }}"
            --artifact-variant "${{ matrix.variant }}"
          )

          if [ "$STORE_REQUIRE_SIGNED" = 'true' ]; then
            args+=(--require-signed)
          fi

          node scripts/finalize-msix-signing.mjs "${args[@]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: store-package-${{ matrix.target.platform }}-${{ matrix.variant }}
          path: |
            ${{ env.STORE_WORKSPACE }}/artifact-inventory-${{ matrix.target.platform }}-${{ matrix.variant }}.json
            ${{ env.STORE_WORKSPACE }}/build-metadata-${{ matrix.target.platform }}-${{ matrix.variant }}.json
            ${{ env.STORE_WORKSPACE }}/payload-validation-${{ matrix.target.platform }}.json
            ${{ env.STORE_WORKSPACE }}/workspace-validation-${{ matrix.target.platform }}.json
            ${{ env.STORE_WORKSPACE }}/reports/desktop-store-build-${{ matrix.target.platform }}-${{ matrix.variant }}.json
            ${{ env.STORE_WORKSPACE }}/release-assets/*.msix
          if-no-files-found: error

  publish:
    name: Publish release metadata
    needs:
      - resolve_plan
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout win_store_packer
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install win_store_packer dependencies
        shell: bash
        run: npm ci

      - name: Download resolved build plan
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.RESOLVED_BUILD_PLAN_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/build-plan

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: store-package-*
          path: ${{ runner.temp }}/publish-input

      - name: Publish release or stage workflow metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(
            --plan "$RUNNER_TEMP/build-plan/release-plan.json"
            --artifacts-dir "$RUNNER_TEMP/publish-input"
            --output-dir "$RUNNER_TEMP/release-metadata"
          )

          if [ "${{ needs.resolve_plan.outputs.publication_mode }}" = 'workflow-artifact' ] || [ "${{ needs.resolve_plan.outputs.dry_run }}" = 'true' ]; then
            args+=(--force-dry-run)
          fi

          node scripts/publish-release.mjs "${args[@]}"

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v6
        with:
          name: store-release-metadata-${{ needs.resolve_plan.outputs.release_tag }}
          path: ${{ runner.temp }}/release-metadata
          if-no-files-found: error
