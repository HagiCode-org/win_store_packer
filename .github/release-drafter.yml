name-template: 'Windows Store v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  ## What Changed

  $CHANGES

  ## Packaging Scope

  - Windows Store packaging workflow updates
  - Desktop packaging contract propagation
  - Store submission and signing pipeline changes

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'ci'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
      - 'minor'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'chore'
      - 'dependencies'
      - 'ci'
      - 'patch'
      - 'documentation'
      - 'docs'
  default: patch
