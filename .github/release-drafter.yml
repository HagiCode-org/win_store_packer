name-template: 'Microsoft Store v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
  - title: 'Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'ci'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
exclude-labels:
  - 'skip-changelog'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
      - 'minor'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'chore'
      - 'dependencies'
      - 'ci'
      - 'patch'
      - 'documentation'
      - 'docs'
  default: patch

template: |
  ## What Changed

  $CHANGES

  ## Packaging Scope

  - Microsoft Store packaging workflow updates
  - Desktop packaging contract propagation
  - Store submission and signing pipeline changes
